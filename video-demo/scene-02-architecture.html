<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>Scene 02 — Architecture</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0a0a0a;
    color: #f5f5f5;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
}
.container {
    width: 1920px;
    height: 1080px;
    position: relative;
    display: flex;
    flex-direction: column;
    padding: 60px 80px;
}
.header {
    text-align: center;
    margin-bottom: 40px;
}
.header h1 {
    font-size: 48px;
    font-weight: 700;
    margin-bottom: 12px;
}
.header p {
    font-size: 20px;
    color: #a3a3a3;
}
.main-content {
    display: flex;
    gap: 60px;
    flex: 1;
    align-items: center;
}
.diagram-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
.capability-panel {
    width: 420px;
    background: #141414;
    border: 1px solid #2a2a2a;
    border-radius: 16px;
    padding: 32px;
}
.capability-panel h2 {
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 24px;
    text-align: center;
}
.cap-section {
    margin-bottom: 24px;
}
.cap-section h3 {
    font-size: 14px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #2a2a2a;
}
.cap-section.available h3 { color: #22c55e; }
.cap-section.not-available h3 { color: #ef4444; }
.cap-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 6px;
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    font-size: 15px;
}
.cap-item.available {
    background: rgba(34, 197, 94, 0.08);
    color: #22c55e;
}
.cap-item.not-available {
    background: rgba(239, 68, 68, 0.08);
    color: #ef4444;
}
.cap-icon {
    width: 24px;
    text-align: center;
    font-weight: 700;
}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Architecture</h1>
        <p>Hermes Agent + MCP capability boundary + Human-in-the-Loop</p>
    </div>
    <div class="main-content">
        <div class="diagram-area">
            <svg width="1100" height="750" viewBox="0 0 1100 750" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#525252"/>
                    </marker>
                    <linearGradient id="agentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.2"/>
                        <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.05"/>
                    </linearGradient>
                    <linearGradient id="mcpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.2"/>
                        <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.05"/>
                    </linearGradient>
                    <linearGradient id="toolsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:0.2"/>
                        <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:0.05"/>
                    </linearGradient>
                    <linearGradient id="humanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#f97316;stop-opacity:0.2"/>
                        <stop offset="100%" style="stop-color:#f97316;stop-opacity:0.05"/>
                    </linearGradient>
                    <linearGradient id="backendGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.2"/>
                        <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0.05"/>
                    </linearGradient>
                </defs>

                <!-- Connection lines -->
                <line x1="550" y1="80" x2="550" y2="130" stroke="#525252" stroke-width="2" marker-end="url(#arrowhead)"/>
                <line x1="550" y1="180" x2="550" y2="230" stroke="#525252" stroke-width="2" marker-end="url(#arrowhead)"/>
                <line x1="550" y1="280" x2="550" y2="330" stroke="#525252" stroke-width="2" marker-end="url(#arrowhead)"/>
                <line x1="550" y1="430" x2="550" y2="480" stroke="#525252" stroke-width="2" marker-end="url(#arrowhead)"/>
                <line x1="550" y1="530" x2="550" y2="580" stroke="#f97316" stroke-width="3" marker-end="url(#arrowhead)"/>
                <line x1="550" y1="630" x2="550" y2="680" stroke="#525252" stroke-width="2" marker-end="url(#arrowhead)"/>

                <!-- User -->
                <rect x="400" y="20" width="300" height="60" rx="12" fill="rgba(148,163,184,0.1)" stroke="#94a3b8" stroke-width="1.5"/>
                <text x="550" y="55" text-anchor="middle" fill="#94a3b8" font-size="18" font-weight="500">Customer</text>

                <!-- Hermes Agent -->
                <rect x="350" y="130" width="400" height="50" rx="12" fill="url(#agentGrad)" stroke="#3b82f6" stroke-width="2"/>
                <text x="550" y="160" text-anchor="middle" fill="#3b82f6" font-size="20" font-weight="600">Hermes Agent</text>

                <!-- MCP -->
                <rect x="400" y="230" width="300" height="50" rx="12" fill="url(#mcpGrad)" stroke="#8b5cf6" stroke-width="2"/>
                <text x="550" y="260" text-anchor="middle" fill="#8b5cf6" font-size="20" font-weight="600">MCP</text>

                <!-- Bounded Tools -->
                <rect x="300" y="330" width="500" height="100" rx="12" fill="url(#toolsGrad)" stroke="#14b8a6" stroke-width="2"/>
                <text x="550" y="360" text-anchor="middle" fill="#14b8a6" font-size="18" font-weight="600">Bounded Business Tools</text>
                <text x="550" y="390" text-anchor="middle" fill="#14b8a6" font-size="14" opacity="0.7">search_catalog · check_inventory · calculate_order_total · create_order_draft</text>

                <!-- Order Draft -->
                <rect x="400" y="480" width="300" height="50" rx="12" fill="rgba(245,158,11,0.1)" stroke="#f59e0b" stroke-width="2"/>
                <text x="550" y="510" text-anchor="middle" fill="#f59e0b" font-size="18" font-weight="600">Order Draft</text>

                <!-- Human Approval -->
                <rect x="350" y="580" width="400" height="50" rx="12" fill="url(#humanGrad)" stroke="#f97316" stroke-width="3"/>
                <text x="550" y="610" text-anchor="middle" fill="#f97316" font-size="20" font-weight="700">Human Approval</text>

                <!-- Backend Transaction -->
                <rect x="400" y="680" width="300" height="50" rx="12" fill="url(#backendGrad)" stroke="#22c55e" stroke-width="2"/>
                <text x="550" y="710" text-anchor="middle" fill="#22c55e" font-size="18" font-weight="600">Backend Transaction</text>

                <!-- Audit Trail (side) -->
                <rect x="850" y="580" width="200" height="50" rx="12" fill="rgba(100,116,139,0.1)" stroke="#64748b" stroke-width="1.5"/>
                <text x="950" y="610" text-anchor="middle" fill="#64748b" font-size="16" font-weight="500">Audit Trail</text>
                <line x1="750" y1="605" x2="850" y2="605" stroke="#525252" stroke-width="2" marker-end="url(#arrowhead)"/>
            </svg>
        </div>
        <div class="capability-panel">
            <h2>Agent Capabilities</h2>
            <div class="cap-section available">
                <h3>Available</h3>
                <div class="cap-item available"><span class="cap-icon">✓</span> search_catalog</div>
                <div class="cap-item available"><span class="cap-icon">✓</span> check_inventory</div>
                <div class="cap-item available"><span class="cap-icon">✓</span> calculate_order_total</div>
                <div class="cap-item available"><span class="cap-icon">✓</span> create_order_draft</div>
            </div>
            <div class="cap-section not-available">
                <h3>Not Available</h3>
                <div class="cap-item not-available"><span class="cap-icon">✕</span> approve_order</div>
                <div class="cap-item not-available"><span class="cap-icon">✕</span> reject_order</div>
                <div class="cap-item not-available"><span class="cap-icon">✕</span> deduct_stock</div>
                <div class="cap-item not-available"><span class="cap-icon">✕</span> send_customer_message</div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
